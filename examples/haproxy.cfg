global
    log stdout local0
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 10s
    timeout client 1m
    timeout server 1m

listen stats
    bind *:<stats-port>
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    # Use a strong credential from a secret manager in real environments.
    stats auth <stats-user>:<stats-password>

frontend app_frontend
    bind *:<frontend-port>
    default_backend app_backend

backend app_backend
    balance roundrobin
    option tcp-check
    server app-node-a <app-node-a>:<app-port> check
    server app-node-b <app-node-b>:<app-port> check
